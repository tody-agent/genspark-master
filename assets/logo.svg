<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" stroke="#312e81" stroke-width="2" />

  <!-- Outer subtle circuit glow -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="url(#glowGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
  
  <!-- Outer accent stars -->
  <path d="M 68 84 Q 78 84 78 74 Q 78 84 88 84 Q 78 84 78 94 Q 78 84 68 84 Z" fill="#38bdf8" opacity="0.8" />
  <path d="M 178 182 Q 186 182 186 174 Q 186 182 194 182 Q 186 182 186 190 Q 186 182 178 182 Z" fill="#f43f5e" opacity="0.8" />
  <path d="M 184 76 Q 190 76 190 70 Q 190 76 196 76 Q 190 76 190 82 Q 190 76 184 76 Z" fill="#c084fc" opacity="0.7" />

  <!-- Central Primary Genspark Star -->
  <g filter="url(#glow)">
    <path d="M 128 36 
             C 128 88, 140 100, 192 100 
             C 140 100, 128 112, 128 164 
             C 128 112, 116 100, 64 100 
             C 116 100, 128 88, 128 36 Z" 
          fill="url(#sparkGrad)" />
    
    <!-- Secondary Intersecting Spark -->
    <path d="M 128 120 
             C 128 160, 138 170, 178 170 
             C 138 170, 128 180, 128 220 
             C 128 180, 118 170, 78 170 
             C 118 170, 128 160, 128 120 Z" 
          fill="url(#sparkGrad)" opacity="0.85" />
  </g>

  <!-- Core White Shimmer Center -->
  <circle cx="128" cy="115" r="7" fill="#ffffff" opacity="0.95" />
  <circle cx="128" cy="165" r="4.5" fill="#ffffff" opacity="0.9" />
</svg>
